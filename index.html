<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feature Phone Simulator</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f8;--surface:#fff;--surface2:#f0f0f4;--surface3:#e8e8ee;
  --border:#d8d8e2;--border2:#c8c8d4;
  --text1:#1a1a2e;--text2:#555568;--text3:#8888a0;
  --accent:#4a7cdc;--accent2:#3862b8;--accent-light:#e8eefb;
  --green:#22c55e;--red:#ef4444;--yellow:#eab308;
}
body{font-family:'Segoe UI',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text1);line-height:1.5;min-height:100vh;direction:rtl}
.app-layout{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:260px;background:var(--surface);border-left:1px solid var(--border);padding:14px;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;gap:14px;transition:width .25s,padding .25s,opacity .25s;position:relative}
.sidebar.collapsed{width:0;padding:0;overflow:hidden;border:none;opacity:0}
.sb-toggle{position:fixed;top:12px;right:12px;z-index:100;height:40px;border-radius:10px;background:var(--accent);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;padding:0 14px;box-shadow:0 2px 12px rgba(74,124,220,.35);transition:.15s;font-family:inherit}
.sb-toggle:hover{background:var(--accent2);box-shadow:0 3px 16px rgba(74,124,220,.45)}
.sb-toggle.open{background:var(--surface);color:var(--text2);border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.sb-toggle.open:hover{border-color:var(--accent);color:var(--accent)}
.sidebar h3{font-size:12px;color:var(--text3);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.sb-section{background:var(--surface2);border-radius:10px;padding:12px}
.sb-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sb-row:last-child{margin-bottom:0}
.sb-label{font-size:11px;color:var(--text2);min-width:60px}
.sb-slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--border);outline:none}
.sb-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer}
.sb-val{font-size:10px;color:var(--text3);min-width:30px;text-align:left;direction:ltr}
.sb-color{width:28px;height:28px;border-radius:6px;border:2px solid var(--border);cursor:pointer;padding:0}
.sb-color::-webkit-color-swatch-wrapper{padding:0}
.sb-color::-webkit-color-swatch{border:none;border-radius:4px}
.sb-btn{width:100%;padding:7px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-family:inherit;transition:.15s}
.sb-btn:hover{border-color:var(--accent);color:var(--accent)}
.sb-btn.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.sb-presets{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sb-preset{width:100%;aspect-ratio:1;border-radius:6px;border:2px solid transparent;cursor:pointer;transition:.15s}
.sb-preset:hover,.sb-preset.active{border-color:var(--accent);transform:scale(1.1)}
.sb-chips{display:flex;flex-wrap:wrap;gap:4px}
.sb-chip{padding:3px 10px;border-radius:12px;font-size:11px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:.15s}
.sb-chip:hover{border-color:var(--accent)}
.sb-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Main area */
.main-area{flex:1;display:flex;flex-direction:column;align-items:center;padding:24px;overflow-y:auto;gap:20px}
.phone-wrapper{display:flex;flex-direction:column;align-items:center;gap:12px}

/* Device selector bar */
.dev-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;max-width:900px}
.dev-select{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text1);font-size:13px;font-family:inherit;cursor:pointer;min-width:180px}
.dev-select:focus{outline:none;border-color:var(--accent)}
.btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{background:var(--accent2)}
.lang-btns{margin-right:auto;display:flex;gap:4px}

/* Screen info strip */
.screen-info{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text2);max-width:900px;width:100%;padding:8px 12px;background:var(--surface);border-radius:10px;border:1px solid var(--border)}
.screen-info .si-name{font-weight:600;color:var(--text1)}
.screen-info .si-sk{display:flex;gap:6px;margin-right:auto;direction:ltr}
.screen-info .si-sk span{padding:2px 8px;background:var(--accent-light);color:var(--accent);border-radius:4px;font-size:10px;font-weight:600}

/* Phone body */
.phone-body{position:relative;width:320px;border-radius:28px;background:#222;overflow:hidden;user-select:none}
.phone-body.light-body{background:#e8e4de}
.phone-earpiece{width:50px;height:5px;border-radius:3px;background:#444;margin:16px auto 10px}
.phone-body.light-body .phone-earpiece{background:#bbb}

/* Screen */
.phone-screen-area{width:280px;height:374px;margin:0 auto;border-radius:6px;overflow:hidden;position:relative;border:1px solid #333}
.phone-body.light-body .phone-screen-area{border-color:#bbb}
.ps-inner{width:100%;height:100%;font-family:'Courier New',monospace;display:flex;flex-direction:column;overflow:hidden;transition:background .3s}

/* Screen internals */
.sc-bar{display:flex;justify-content:space-between;padding:2px 8px;height:20px;font-size:10px;align-items:center;opacity:.9}
.sc-title{padding:4px 8px;font-size:11px;font-weight:600}
.sc-title.center{text-align:center}
.sc-body{flex:1;overflow-y:auto;overflow-x:hidden}
.sc-softkeys{display:flex;justify-content:space-between;padding:3px 8px;height:22px;font-size:9px;align-items:center;font-weight:500}
.sc-softkeys .sk-center{font-weight:700}

/* List items */
.sc-list-item{padding:8px 10px;font-size:11px;cursor:pointer;transition:background .1s;border-bottom:1px solid rgba(255,255,255,.06)}
.sc-list-item.focused{font-weight:600}
.sc-list-item .li-sub{font-size:9px;opacity:.6;margin-top:1px}
.sc-list-item .li-row{display:flex;justify-content:space-between;align-items:center}
.sc-list-item .li-time{font-size:8px;opacity:.5}
.sc-list-item .li-val{font-size:9px;opacity:.5}

/* Menu grid */
.sc-menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px;align-content:start;flex:1}
.sc-menu-item{display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:6px;cursor:pointer;transition:background .1s}
.sc-menu-item.focused{font-weight:600}
.sc-menu-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:3px}
.sc-menu-label{font-size:8px;text-align:center}

/* Calendar */
.sc-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:0 8px}
.sc-cal-head{text-align:center;font-size:9px;opacity:.5;padding:2px}
.sc-cal-day{text-align:center;font-size:10px;padding:4px 1px;border-radius:3px}
.sc-cal-day.today{font-weight:bold}
.sc-cal-day.empty{opacity:0}
.sc-cal-event{margin:8px 8px 0;padding:5px;border-radius:4px;font-size:9px}

/* Call screen */
.sc-call{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.sc-call-avatar{width:50px;height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;font-size:18px}
.sc-call-name{font-size:15px;font-weight:bold}
.sc-call-num{font-size:10px;opacity:.6;direction:ltr}
.sc-call-pulse{width:10px;height:10px;border-radius:5px;animation:pulse 1.5s ease-in-out infinite;margin-top:8px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* D-Pad area */
.phone-controls{padding:10px 20px 12px}
.sk-buttons{display:flex;justify-content:space-between;margin-bottom:8px}
.sk-btn{padding:5px 0;width:70px;text-align:center;border-radius:5px;font-size:10px;cursor:pointer;transition:.1s;font-family:monospace}
.sk-btn:hover{opacity:.8}
.sk-btn:active{transform:scale(.95)}

.dpad-area{display:flex;justify-content:center;margin:6px 0}
.dpad{position:relative;width:90px;height:90px}
.dpad-ring{width:90px;height:90px;border-radius:50%;background:#333;position:absolute}
.phone-body.light-body .dpad-ring{background:#ccc}
.dpad-center{width:28px;height:28px;border-radius:50%;background:#444;position:absolute;top:31px;left:31px;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;font-size:8px;color:#999;font-weight:bold}
.phone-body.light-body .dpad-center{background:#bbb;color:#666}
.dpad-center:hover{background:#555}
.phone-body.light-body .dpad-center:hover{background:#aaa}
.dpad-btn{position:absolute;cursor:pointer;z-index:4;display:flex;align-items:center;justify-content:center}
.dpad-btn:hover{opacity:.7}
.dpad-up{top:2px;left:33px;width:24px;height:24px}
.dpad-down{bottom:2px;left:33px;width:24px;height:24px}
.dpad-left{left:2px;top:33px;width:24px;height:24px}
.dpad-right{right:2px;top:33px;width:24px;height:24px}
.dpad-arrow{fill:#888;width:10px;height:10px}
.phone-body.light-body .dpad-arrow{fill:#777}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px 10px}
.key{text-align:center;padding:6px;border-radius:5px;font-size:9px;cursor:pointer;font-family:monospace;transition:.1s}
.key:hover{opacity:.7}
.key:active{transform:scale(.95)}

.call-btns{display:flex;justify-content:center;gap:16px;margin-top:4px}
.call-btn{width:50px;padding:5px;border-radius:5px;text-align:center;font-size:9px;cursor:pointer;font-family:monospace;font-weight:600}

/* Screen nav tabs below phone */
.screen-tabs{display:flex;flex-wrap:wrap;gap:5px;max-width:320px;justify-content:center}
.screen-tab{padding:4px 12px;border-radius:14px;font-size:11px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:.15s}
.screen-tab:hover{border-color:var(--accent)}
.screen-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Right panel — spec */
.spec-panel{max-width:900px;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.sp-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.sp-head{padding:8px 12px;font-size:11px;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border)}
.sp-body{padding:10px 12px;font-size:12px;color:var(--text2)}
.sp-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--surface2)}
.sp-row:last-child{border-bottom:none}
.sp-row .sp-key{color:var(--text3);font-size:11px}
.sp-row .sp-val{font-weight:500;font-size:11px}

/* Modal (reused from previous) */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto}
.modal-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:15px;margin:0}
.modal-close{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer}
.modal-body{padding:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;color:var(--text3);margin-bottom:3px}
.form-group input,.form-group select{width:100%;padding:7px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text1);font-size:12px;font-family:inherit}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-hint{font-size:9px;color:var(--text3);margin-top:2px}
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;right:0;left:0;background:var(--surface);border:1px solid var(--border);border-radius:7px;z-index:10;max-height:130px;overflow-y:auto;margin-top:2px}
.ac-item{padding:6px 10px;font-size:11px;cursor:pointer;color:var(--text2)}
.ac-item:hover{background:var(--surface2);color:var(--text1)}
.modal-actions{display:flex;gap:8px;margin-top:14px}

@media(max-width:1100px){
  .sidebar{width:220px;padding:10px}
}
@media(max-width:900px){
  .app-layout{flex-direction:column}
  .sidebar{width:100%;border-left:none;border-bottom:1px solid var(--border);flex-direction:row;flex-wrap:wrap;overflow-x:auto;max-height:260px}
  .sidebar.collapsed{max-height:0;padding:0;border:none}
  .sidebar .sb-section{min-width:180px}
  .sb-toggle{top:auto;bottom:10px;right:10px}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

/* ═══════════ THEME PRESETS ═══════════ */
const THEME_PRESETS = [
  {id:"dark",    label:"כהה",     lbEn:"Dark",    bg:"#1a1a2e",bar:"#16213e",title:"#1e2d4a",text:"#a0b4d0",highlight:"#2a3f5f",accent:"#6a9fd8",softkey:"#8ab4f0",dim:"#667788",bodyDark:true},
  {id:"navy",    label:"כחול כהה",lbEn:"Navy",    bg:"#0f1b33",bar:"#152244",title:"#1a2d55",text:"#8ea8cc",highlight:"#1f3a6a",accent:"#5b9ee8",softkey:"#7ab4f8",dim:"#5a7090",bodyDark:true},
  {id:"light",   label:"בהיר",    lbEn:"Light",   bg:"#e8eef4",bar:"#d0d8e4",title:"#c4cedc",text:"#3a4a5c",highlight:"#bccada",accent:"#3a70c0",softkey:"#2860a8",dim:"#6a7a8c",bodyDark:false},
  {id:"warm",    label:"חם",      lbEn:"Warm",    bg:"#faf5ee",bar:"#e8dfd0",title:"#ddd4c4",text:"#4a3f30",highlight:"#d4c8b0",accent:"#b07830",softkey:"#9a6820",dim:"#8a7a60",bodyDark:false},
  {id:"green",   label:"ירוק",    lbEn:"Green",   bg:"#1a2e1a",bar:"#1e3e1e",title:"#224a22",text:"#a0d0a0",highlight:"#2a5f2a",accent:"#6ad86a",softkey:"#8af08a",dim:"#608860",bodyDark:true},
  {id:"pink",    label:"ורוד",    lbEn:"Pink",    bg:"#2e1a2a",bar:"#3e1e38",title:"#4a2244",text:"#d0a0c8",highlight:"#5f2a55",accent:"#d86ac0",softkey:"#f08ae0",dim:"#886080",bodyDark:true},
  {id:"sepia",   label:"ספיה",    lbEn:"Sepia",   bg:"#f0e6d2",bar:"#d4c8aa",title:"#c8bc9e",text:"#4a4030",highlight:"#c0b490",accent:"#8a6a30",softkey:"#7a5a20",dim:"#8a7a5a",bodyDark:false},
  {id:"ocean",   label:"אוקיינוס",lbEn:"Ocean",   bg:"#0a2030",bar:"#0e2a3e",title:"#12344a",text:"#80c0d8",highlight:"#1a4a5f",accent:"#40b8d8",softkey:"#60d0f0",dim:"#508898",bodyDark:true},
];

const DEFAULT_THEME = THEME_PRESETS[0];

/* ═══════════ SCREEN DEFINITIONS ═══════════ */
const SCREEN_DEFS = [
  {id:"idle",      he:"מסך ראשי",   en:"Home",         icon:"🏠",skHe:["תפריט","","אנ״ק"],      skEn:["Menu","","Contacts"],    type:"idle"},
  {id:"main_menu", he:"תפריט ראשי", en:"Main Menu",    icon:"📱",skHe:["בחר","אישור","חזור"],   skEn:["Select","OK","Back"],     type:"menu"},
  {id:"calendar",  he:"לוח שנה",    en:"Calendar",     icon:"📅",skHe:["אפשרויות","הצג","חזור"],skEn:["Options","View","Back"],  type:"calendar"},
  {id:"contacts",  he:"אנשי קשר",   en:"Contacts",     icon:"👤",skHe:["אפשרויות","פתח","חזור"],skEn:["Options","Open","Back"],  type:"contacts"},
  {id:"messages",  he:"הודעות",      en:"Messages",     icon:"✉️",skHe:["חדשה","פתח","חזור"],    skEn:["New","Open","Back"],      type:"messages"},
  {id:"settings",  he:"הגדרות",      en:"Settings",     icon:"⚙️",skHe:["בחר","אישור","חזור"],   skEn:["Select","OK","Back"],     type:"settings"},
  {id:"call",      he:"שיחה נכנסת",  en:"Incoming Call",icon:"📞",skHe:["דחה","ענה","השתק"],     skEn:["Reject","Answer","Silent"],type:"call"},
];

const MENU_ITEMS = [
  {id:"main_menu",icon:"📞",he:"טלפון",   en:"Phone"},
  {id:"messages", icon:"✉️",he:"הודעות",   en:"Messages"},
  {id:"contacts", icon:"👤",he:"אנשי קשר",en:"Contacts"},
  {id:"calendar", icon:"📅",he:"לוח שנה", en:"Calendar"},
  {id:"settings", icon:"⚙️",he:"הגדרות",   en:"Settings"},
  {id:"main_menu",icon:"🌐",he:"דפדפן",   en:"Browser"},
  {id:"main_menu",icon:"📷",he:"מצלמה",   en:"Camera"},
  {id:"main_menu",icon:"📻",he:"רדיו",    en:"FM Radio"},
  {id:"main_menu",icon:"📱",he:"יישומים", en:"Apps"},
];

/* ═══════════ AUTO-COMPLETE DB ═══════════ */
const AC_DB = {
  manufacturers:["HY Digital","Nokia","Itel","Tecno","Lava","Micromax","Samsung","ZTE","Alcatel","Gigaset","Doro","Philips"],
  chipsets:[
    {name:"UNISOC UMS9117",platform:"Mocor",os:"ThreadX RTOS"},
    {name:"UNISOC T107",platform:"Mocor",os:"ThreadX RTOS"},
    {name:"UNISOC SC9820E",platform:"Mocor",os:"ThreadX RTOS"},
    {name:"MediaTek MT6261",platform:"MAUI",os:"Nucleus RTOS"},
    {name:"MediaTek MT6731",platform:"MAUI",os:"Nucleus RTOS"},
    {name:"Qualcomm 205",platform:"Linux",os:"KaiOS"},
  ],
  platforms:["Mocor","MAUI","Nucleus","KaiOS","Linux"],
  osOptions:["ThreadX RTOS","Nucleus RTOS","KaiOS","Linux"],
  screenPresets:[{s:'1.8"',w:128,h:160,d:"QQVGA"},{s:'2.0"',w:176,h:220,d:"QCIF+"},{s:'2.4"',w:240,h:320,d:"QVGA"},{s:'2.8"',w:240,h:320,d:"QVGA"},{s:'3.0"',w:320,h:480,d:"HVGA"}],
};

const LS_KEY="wf_draft_devices";
function loadDrafts(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"[]")}catch{return[]}}
function saveDrafts(d){localStorage.setItem(LS_KEY,JSON.stringify(d))}

/* ═══════════ INTERACTIVE SCREEN RENDERER ═══════════ */
function ScreenRenderer({screenId, lang, theme, cursor, deviceName, onNavigate}) {
  const h=lang==="he", t=theme;
  const barStyle={background:t.bar,color:t.dim};
  const titleStyle={background:t.title,color:t.text};
  const bodyStyle={color:t.text};
  const skStyle={background:t.bar,color:t.softkey,borderTop:`1px solid ${t.highlight}`};
  const focusedBg=t.highlight;
  const isRtl=h;

  function Bar(){return <div className="sc-bar" style={barStyle}><span>IL 4G</span><span>12:45</span><span>100%</span></div>}
  function SK({l,c,r}){return <div className="sc-softkeys" style={skStyle}><span>{l}</span><span className="sk-center">{c}</span><span>{r}</span></div>}

  if(screenId==="idle"){
    return (<div className="ps-inner" style={{background:t.bg,direction:isRtl?"rtl":"ltr"}}>
      <Bar/>
      <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",gap:8}}>
        <div style={{fontSize:38,fontWeight:"bold",color:t.text}}>{new Date().getHours().toString().padStart(2,"0")}:{new Date().getMinutes().toString().padStart(2,"0")}</div>
        <div style={{fontSize:12,color:t.dim}}>{h?"יום ב׳, 17 אוגוסט":"Mon, Aug 17"}</div>
        <div style={{fontSize:10,color:t.dim,marginTop:18,opacity:.6}}>{deviceName||"FuturePad"}</div>
      </div>
      <SK l={h?"תפריט":"Menu"} c="" r={h?"אנ״ק":"Contacts"}/>
    </div>);
  }

  if(screenId==="main_menu"){
    return (<div className="ps-inner" style={{background:t.bg,direction:isRtl?"rtl":"ltr"}}>
      <Bar/>
      <div className="sc-title" style={titleStyle}>{h?"תפריט ראשי":"Main Menu"}</div>

  }

  return <div className="ps-inner" style={{background:t.bg,color:t.text,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>{screenId}</div>;
}

/* ═══════════ AUTO-COMPLETE INPUT ═══════════ */
function ACInput({value,onChange,suggestions,placeholder,label,hint}){
  const[open,setOpen]=useState(false);
  const ref=useRef(null);
  const filtered=suggestions.filter(s=>{const t=(value||"").toLowerCase();return typeof s==="string"?s.toLowerCase().includes(t):s.name.toLowerCase().includes(t)});
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h)},[]);
  return(<div className="form-group">{label&&<label>{label}</label>}<div className="ac-wrap" ref={ref}>
    <input value={value} placeholder={placeholder} onChange={e=>{onChange(e.target.value);setOpen(true)}} onFocus={()=>setOpen(true)}/>
    {open&&filtered.length>0&&<div className="ac-list">{filtered.slice(0,6).map((s,i)=>{const n=typeof s==="string"?s:s.name;return<div key={i} className="ac-item" onMouseDown={()=>{onChange(n,s);setOpen(false)}}>{n}</div>})}</div>}
  </div>{hint&&<div className="form-hint">{hint}</div>}</div>);
}

/* ═══════════ ADD DEVICE MODAL ═══════════ */
function AddDeviceModal({onClose,onSave,isHe}){
  const[f,sF]=useState({name:"",manufacturer:"",chipset:"",platform:"",os:"",screenWidth:240,screenHeight:320,screenSize:'2.4"',screenDensity:"QVGA",colorDepth:"16-bit",inputType:"T9 + D-Pad + 3 Softkeys",midlet:"MIDP 2.0 / CLDC 1.1"});
  const set=(k,v)=>sF(p=>({...p,[k]:v}));
  const onChip=(v,obj)=>{const u={chipset:typeof obj==="string"?obj:obj.name};if(obj&&typeof obj==="object"){u.platform=obj.platform;u.os=obj.os}sF(p=>({...p,...u}))};
  const onSize=v=>{const p=AC_DB.screenPresets.find(x=>x.s===v);if(p)sF(x=>({...x,screenSize:v,screenWidth:p.w,screenHeight:p.h,screenDensity:p.d}));else set("screenSize",v)};
  const save=()=>{if(!f.name.trim())return;onSave({id:f.name.toLowerCase().replace(/[^a-z0-9]+/g,"-"),  ...f,screenWidth:+f.screenWidth,screenHeight:+f.screenHeight,screens:[...SCREEN_DEFS],_draft:true})};
  return(<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}><div className="modal">
    <div className="modal-head"><h2>{isHe?"הוספת מכשיר":"Add Device"}</h2><button className="modal-close" onClick={onClose}>×</button></div>
    <div className="modal-body">
      <div className="form-group"><label>{isHe?"שם המכשיר":"Name"} *</label><input value={f.name} onChange={e=>set("name",e.target.value)} placeholder="FuturePad X200"/></div>
      <ACInput label={isHe?"יצרן":"Manufacturer"} value={f.manufacturer} onChange={v=>set("manufacturer",v)} suggestions={AC_DB.manufacturers}/>
      <ACInput label={isHe?"מעבד":"Chipset"} value={f.chipset} onChange={onChip} suggestions={AC_DB.chipsets} hint={isHe?"ממלא פלטפורמה אוטומטית":"Auto-fills platform"}/>
      <div className="form-row">
        <ACInput label={isHe?"פלטפורמה":"Platform"} value={f.platform} onChange={v=>set("platform",v)} suggestions={AC_DB.platforms}/>
        <ACInput label={isHe?"מ.הפעלה":"OS"} value={f.os} onChange={v=>set("os",v)} suggestions={AC_DB.osOptions}/>
      </div>
      <div className="form-group"><label>{isHe?"גודל מסך":"Screen"}</label><select value={f.screenSize} onChange={e=>onSize(e.target.value)}>{AC_DB.screenPresets.map(p=><option key={p.s} value={p.s}>{p.s} ({p.w}×{p.h})</option>)}</select></div>
      <div className="modal-actions"><button className="btn btn-accent" onClick={save}>{isHe?"הוסף":"Add"}</button><button className="btn" onClick={onClose}>{isHe?"ביטול":"Cancel"}</button></div>
    </div>
  </div></div>);
}

  const[screenId,setScreenId]=useState("idle");
  const[cursor,setCursor]=useState(0);
  const[navStack,setNavStack]=useState([]);
  const[devices,setDevices]=useState([]);
  const[drafts,setDrafts]=useState([]);
  const[activeDevId,setActiveDevId]=useState(null);
  const[showAdd,setShowAdd]=useState(false);
  const[sidebarOpen,setSidebarOpen]=useState(true);
  const isHe=lang==="he";

  useEffect(()=>{
    fetch("devices.json").then(r=>r.json()).then(d=>{setDevices(d);if(d.length)setActiveDevId(d[0].id)}).catch(()=>{});
    setDrafts(loadDrafts());
  },[]);

  const allDevices=[...devices,...drafts];
  const activeDev=allDevices.find(d=>d.id===activeDevId)||allDevices[0]||{name:"FuturePad T127",screenWidth:240,screenHeight:320,screenDensity:"QVGA",screenSize:'2.4"',chipset:"UNISOC UMS9117",platform:"Mocor",os:"ThreadX RTOS",manufacturer:"HY Digital",colorDepth:"16-bit",inputType:"T9 + D-Pad + 3 Softkeys",midlet:"MIDP 2.0 / CLDC 1.1"};
  const scrDef=SCREEN_DEFS.find(s=>s.id===screenId)||SCREEN_DEFS[0];

  const getListLen=()=>{if(screenId==="main_menu")return 9;if(screenId==="contacts")return 5;if(screenId==="messages")return 4;if(screenId==="settings")return 6;return 0};
  const getGridCols=()=>screenId==="main_menu"?3:1;

  const navigate=(id)=>{setNavStack(s=>[...s,{screenId,cursor}]);setScreenId(id);setCursor(0)};
  const goBack=()=>{if(navStack.length){const prev=navStack[navStack.length-1];setScreenId(prev.screenId);setCursor(prev.cursor);setNavStack(s=>s.slice(0,-1))}else if(screenId!=="idle"){setScreenId("idle");setCursor(0)}};

  const dpadUp=()=>{const len=getListLen();if(!len)return;const cols=getGridCols();setCursor(c=>{const next=c-cols;return next<0?(len-1):next})};
  const dpadDown=()=>{const len=getListLen();if(!len)return;const cols=getGridCols();setCursor(c=>{const next=c+cols;return next>=len?0:next})};
  const dpadLeft=()=>{if(getGridCols()>1)setCursor(c=>c>0?c-1:getListLen()-1)};
  const dpadRight=()=>{if(getGridCols()>1)setCursor(c=>c<getListLen()-1?c+1:0)};
  const dpadOk=()=>{
    if(screenId==="idle"){navigate("main_menu");return}
    if(screenId==="main_menu"){const mi=MENU_ITEMS[cursor];if(mi)navigate(mi.id);return}
  };

  useEffect(()=>{
    const handler=(e)=>{
      if(showAdd)return;
      if(e.key==="ArrowUp"){e.preventDefault();dpadUp()}
      else if(e.key==="ArrowDown"){e.preventDefault();dpadDown()}
      else if(e.key==="ArrowLeft"){e.preventDefault();isHe?dpadRight():dpadLeft()}
      else if(e.key==="ArrowRight"){e.preventDefault();isHe?dpadLeft():dpadRight()}
      else if(e.key==="Enter"){e.preventDefault();dpadOk()}
      else if(e.key==="Backspace"||e.key==="Escape"){e.preventDefault();goBack()}
    };
    window.addEventListener("keydown",handler);
    return()=>window.removeEventListener("keydown",handler);
  },[screenId,cursor,navStack,isHe,showAdd]);

  const addDraft=(dev)=>{const u=[...drafts,dev];setDrafts(u);saveDrafts(u);setActiveDevId(dev.id);setShowAdd(false)};

  const sk=isHe?(scrDef.skHe||scrDef.skEn):(scrDef.skEn||scrDef.skHe);
  const isDark=theme.bodyDark;
  const screenFilter=`brightness(${brightness}%)`;

  return(<div className="app-layout">
    {/* ═══ SIDEBAR TOGGLE ═══ */}

      {sidebarOpen?"✕":(<>{isHe?"⚙ הגדרות תצוגה":"⚙ Display Settings"}</>)}
    </button>

    {/* ═══ SIDEBAR ═══ */}
    <div className={`sidebar${sidebarOpen?"":" collapsed"}`}>
      <h3>{isHe?"ערכת צבעים":"Theme"}</h3>

        <div className="sb-presets">
          {THEME_PRESETS.map(tp=><div key={tp.id} className={`sb-preset${theme.id===tp.id?" active":""}`} style={{background:tp.bg}} onClick={()=>setTheme(tp)} title={isHe?tp.label:tp.lbEn}/>)}
        </div>
      </div>

      <h3>{isHe?"בהירות":"Brightness"}</h3>
      <div className="sb-section">
        <div className="sb-row">
          <span className="sb-label">☀</span>
          <input type="range" className="sb-slider" min={40} max={160} value={brightness} onChange={e=>setBrightness(+e.target.value)}/>
          <span className="sb-val">{brightness}%</span>
        </div>
      </div>

      <h3>{isHe?"צבע מותאם":"Custom Color"}</h3>
      <div className="sb-section">
        <div className="sb-row">
          <span className="sb-label">{isHe?"רקע":"BG"}</span>
          <input type="color" className="sb-color" value={theme.bg} onChange={e=>setTheme(t=>({...t,id:"custom",bg:e.target.value}))}/>
          <span className="sb-label">{isHe?"כותרת":"Title"}</span>
          <input type="color" className="sb-color" value={theme.title} onChange={e=>setTheme(t=>({...t,id:"custom",title:e.target.value}))}/>
        </div>
        <div className="sb-row">
          <span className="sb-label">{isHe?"טקסט":"Text"}</span>
          <input type="color" className="sb-color" value={theme.text} onChange={e=>setTheme(t=>({...t,id:"custom",text:e.target.value}))}/>
          <span className="sb-label">{isHe?"הדגשה":"Accent"}</span>
          <input type="color" className="sb-color" value={theme.accent} onChange={e=>setTheme(t=>({...t,id:"custom",accent:e.target.value}))}/>
        </div>
      </div>

      <h3>{isHe?"מסכים":"Screens"}</h3>
      <div className="sb-section">
        <div className="sb-chips">
          {SCREEN_DEFS.map(s=><span key={s.id} className={`sb-chip${screenId===s.id?" active":""}`} onClick={()=>{setScreenId(s.id);setCursor(0);setNavStack([])}}>{s.icon} {isHe?s.he:s.en}</span>)}

    </div>

    {/* ═══ MAIN ═══ */}

          <div className="sp-head">{isHe?"מפת ניווט":"Navigation"}</div>
          <div className="sp-body">
            <div className="sp-row"><span className="sp-key">{isHe?"מסך נוכחי":"Current"}</span><span className="sp-val">{isHe?scrDef.he:scrDef.en}</span></div>
            <div className="sp-row"><span className="sp-key">{isHe?"סמן":"Cursor"}</span><span className="sp-val">{cursor}</span></div>
            <div className="sp-row"><span className="sp-key">{isHe?"היסטוריה":"Stack"}</span><span className="sp-val">{navStack.map(s=>SCREEN_DEFS.find(x=>x.id===s.screenId)?.icon||"?").join(" → ")||"—"}</span></div>
            <div className="sp-row"><span className="sp-key">LSK</span><span className="sp-val">{sk[0]||"—"}</span></div>
            <div className="sp-row"><span className="sp-key">CSK</span><span className="sp-val">{sk[1]||"—"}</span></div>
            <div className="sp-row"><span className="sp-key">RSK</span><span className="sp-val">{sk[2]||"—"}</span></div>
          </div>
        </div>
      </div>
    </div>

    {showAdd&&<AddDeviceModal onClose={()=>setShowAdd(false)} onSave={addDraft} isHe={isHe}/>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>

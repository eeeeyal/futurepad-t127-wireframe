<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feature Phone Wireframe Platform</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e12; --surface: #18181f; --surface2: #222230; --surface3: #2c2c3a;
    --border: #333345; --border2: #444458;
    --text1: #e8e8f0; --text2: #a0a0b8; --text3: #6a6a80;
    --accent: #5b8def; --accent2: #3a6ad4;
    --green: #4ade80; --red: #f87171; --yellow: #facc15;
    --screen-bg: #1a1a2e; --screen-bar: #16213e; --screen-title: #1e2d4a;
    --screen-text: #a0b4d0; --screen-highlight: #2a3f5f; --screen-accent: #6a9fd8;
    --screen-link: #8ab4f0; --screen-dim: #667788;
  }
  body { font-family: 'Segoe UI', -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text1); line-height: 1.6; min-height: 100vh; direction: rtl; }
  .container { max-width: 1240px; margin: 0 auto; padding: 24px; }

  /* Topbar */
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .topbar-title { font-size: 16px; font-weight: 700; white-space: nowrap; }
  .topbar-sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

  /* Select / Dropdown */
  .sel-wrap { position: relative; }
  .sel-btn { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); background: var(--surface2); color: var(--text1); cursor: pointer; transition: .15s; white-space: nowrap; }
  .sel-btn:hover { border-color: var(--accent); }
  .sel-btn svg { width: 12px; height: 12px; fill: var(--text3); }
  .sel-menu { position: absolute; top: calc(100% + 4px); right: 0; min-width: 260px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; z-index: 100; overflow: hidden; display: none; }
  .sel-menu.open { display: block; }
  .sel-opt { padding: 10px 14px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .sel-opt:last-child { border-bottom: none; }
  .sel-opt:hover { background: var(--surface2); }
  .sel-opt.active { color: var(--accent); font-weight: 600; }
  .sel-opt .draft-badge { font-size: 9px; background: var(--yellow); color: #000; padding: 1px 6px; border-radius: 3px; font-weight: 700; }
  .sel-opt .add-btn { color: var(--accent); font-weight: 600; }

  /* Common */
  .badge { background: var(--accent); color: #fff; padding: 3px 12px; border-radius: 16px; font-size: 11px; font-weight: 600; white-space: nowrap; direction: ltr; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  h2 { font-size: 17px; font-weight: 600; margin-bottom: 10px; }
  h3 { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text2); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 24px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
  .stat-val { font-size: 20px; font-weight: 700; direction: ltr; }
  .stat-lbl { font-size: 10px; color: var(--text3); margin-top: 3px; }

  /* Language + controls row */
  .controls-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  .ctrl-btn { padding: 5px 14px; border-radius: 16px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--surface); color: var(--text3); cursor: pointer; transition: .15s; }
  .ctrl-btn:hover { border-color: var(--accent); color: var(--text1); }
  .ctrl-btn.active { background: var(--accent2); border-color: var(--accent); color: #fff; }

  /* Tabs */
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .tab { padding: 6px 16px; border-radius: 18px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text2); cursor: pointer; transition: .15s; }
  .tab:hover { border-color: var(--accent); color: var(--text1); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Layout */
  .main-layout { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .phone-col { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
  .phone-label { font-size: 12px; color: var(--text3); font-weight: 500; }
  .spec-col { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 14px; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .card-head { padding: 9px 14px; font-size: 11px; font-weight: 600; color: var(--text2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .card-head .badge-sm { background: var(--surface3); padding: 2px 7px; border-radius: 8px; font-size: 10px; direction: ltr; font-family: monospace; }
  .card-body { padding: 12px 14px; }

  .spec-row { display: flex; gap: 28px; margin-bottom: 8px; }
  .spec-item label { display: block; font-size: 10px; color: var(--text3); }
  .spec-item span { font-size: 13px; font-weight: 500; }

  .softkey-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; direction: ltr; }
  .sk-box { text-align: center; }
  .sk-box label { display: block; font-size: 9px; color: var(--text3); margin-bottom: 1px; }
  .sk-box span { font-size: 12px; font-weight: 600; color: var(--screen-link); }

  .zone-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .zone-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); flex-shrink: 0; }
  .zone-item span { font-size: 11px; color: var(--text2); }
  .zone-item .px { color: var(--accent); font-weight: 600; font-size: 10px; direction: ltr; display: inline; }

  .note-item { font-size: 11px; color: var(--text2); margin-bottom: 5px; padding-right: 14px; position: relative; }
  .note-item::before { content: ""; position: absolute; right: 0; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  /* Tables */
  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table th { text-align: right; padding: 8px 12px; background: var(--surface); color: var(--text3); font-size: 10px; border-bottom: 1px solid var(--border); }
  .data-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text2); }
  .data-table tr:hover td { background: var(--surface); }
  .data-table .ltr-cell { direction: ltr; text-align: left; font-family: monospace; font-size: 11px; color: var(--screen-link); }

  /* Overview Grid */
  .overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 14px; margin-top: 10px; }
  .thumb-card { cursor: pointer; border-radius: 10px; overflow: hidden; border: 2px solid var(--border); transition: .15s; background: var(--surface); }
  .thumb-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .thumb-card.active { border-color: var(--accent); }
  .thumb-screen { height: 200px; overflow: hidden; }
  .thumb-screen > div { transform: scale(0.52); transform-origin: top right; width: 300px; height: 400px; pointer-events: none; direction: ltr; }
  .thumb-label { padding: 6px 8px; text-align: center; border-top: 1px solid var(--border); }
  .thumb-label .primary { font-size: 11px; font-weight: 600; }
  .thumb-label .secondary { font-size: 10px; color: var(--text3); }

  /* Changelog */
  .cl-entry { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; align-items: flex-start; }
  .cl-entry:last-child { border-bottom: none; }
  .cl-date { color: var(--text3); font-family: monospace; font-size: 11px; white-space: nowrap; min-width: 82px; direction: ltr; text-align: left; }
  .cl-author { color: var(--accent); font-weight: 500; min-width: 50px; white-space: nowrap; }
  .cl-desc { color: var(--text2); flex: 1; }
  .cl-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 9px; font-weight: 700; margin-left: 5px; }
  .cl-tag.added { background: #1a3a2a; color: var(--green); }
  .cl-tag.changed { background: #2a2a1a; color: var(--yellow); }
  .cl-tag.fixed { background: #3a1a1a; color: var(--red); }
  .cl-tag.info { background: #1a2a3a; color: var(--accent); }

  .info-box { background: var(--surface); border: 1px solid var(--accent2); border-radius: 10px; padding: 14px; margin-top: 20px; }
  .info-box h3 { color: var(--accent); margin-bottom: 4px; font-size: 13px; }
  .info-box p { font-size: 12px; color: var(--text2); line-height: 1.7; }

  /* Phone screens (LTR base, RTL when Hebrew) */
  .phone-screen { width: 300px; height: 400px; font-family: 'Courier New', monospace; overflow: hidden; background: var(--screen-bg); direction: ltr; }
  .phone-screen.rtl-content { direction: rtl; }
  .phone-screen.rtl-content .s-bar { direction: ltr; }
  .phone-screen.rtl-content .s-softkeys { direction: ltr; }
  .phone-screen.rtl-content .s-menu-grid { direction: rtl; }
  .phone-screen.rtl-content .cal-grid { direction: rtl; }
  .s-bar { display: flex; justify-content: space-between; align-items: center; padding: 2px 8px; background: var(--screen-bar); height: 22px; font-size: 11px; color: var(--screen-text); }
  .s-title { padding: 5px 8px; font-size: 12px; color: var(--screen-text); background: var(--screen-title); }
  .s-title.center { text-align: center; }
  .s-body { flex: 1; overflow: hidden; }
  .s-softkeys { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; background: var(--screen-bar); height: 24px; border-top: 1px solid #253550; font-size: 10px; color: var(--screen-link); }
  .s-softkeys .center { font-weight: bold; }
  .s-list-item { padding: 9px 12px; border-bottom: 1px solid var(--screen-title); font-size: 12px; color: var(--screen-text); }
  .s-list-item.sel { background: var(--screen-highlight); color: var(--text1); }
  .s-list-item .sub { font-size: 10px; color: var(--screen-dim); margin-top: 2px; }
  .s-list-item .meta { display: flex; justify-content: space-between; align-items: center; }
  .s-list-item .meta .time { font-size: 9px; color: var(--screen-dim); }
  .s-list-item .bold { font-weight: bold; }
  .s-list-item .between { display: flex; justify-content: space-between; align-items: center; }
  .s-list-item .val { font-size: 10px; color: var(--screen-dim); }
  .s-flex { display: flex; flex-direction: column; height: 100%; }
  .s-menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 8px; align-content: start; flex: 1; }
  .s-menu-item { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 9px 3px; border-radius: 5px; border: 1px solid transparent; }
  .s-menu-item.sel { background: var(--screen-highlight); border-color: #3a5a8a; }
  .s-menu-icon { width: 30px; height: 30px; border-radius: 6px; background: #253550; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .s-menu-item.sel .s-menu-icon { background: #3a5a8a; }
  .s-menu-label { font-size: 9px; color: var(--screen-dim); margin-top: 3px; text-align: center; }
  .s-menu-item.sel .s-menu-label { color: var(--text1); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; padding: 0 10px; }
  .cal-head { text-align: center; font-size: 10px; color: var(--screen-dim); padding: 3px; }
  .cal-day { text-align: center; font-size: 11px; padding: 4px 2px; border-radius: 4px; color: #c0d0e0; }
  .cal-day.today { background: var(--screen-accent); color: var(--screen-bg); font-weight: bold; }
  .cal-day.empty { color: transparent; }
  .cal-event { margin: 10px 10px 0; padding: 6px; background: var(--screen-bar); border-radius: 5px; }
  .cal-event .title { font-size: 10px; color: var(--screen-link); }
  .cal-event .desc { font-size: 9px; color: var(--screen-dim); margin-top: 1px; }
  .call-center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; }
  .call-label { font-size: 11px; color: var(--screen-dim); }
  .call-avatar { width: 56px; height: 56px; border-radius: 28px; background: #253550; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--screen-accent); }
  .call-name { font-size: 16px; color: var(--text1); font-weight: bold; }
  .call-num { font-size: 11px; color: #8899aa; direction: ltr; }
  .call-pulse { width: 12px; height: 12px; border-radius: 6px; background: var(--green); margin-top: 12px; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
  .modal-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h2 { font-size: 16px; margin: 0; }
  .modal-close { background: none; border: none; color: var(--text3); font-size: 20px; cursor: pointer; padding: 4px 8px; }
  .modal-close:hover { color: var(--text1); }
  .modal-body { padding: 18px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 11px; color: var(--text3); margin-bottom: 4px; font-weight: 500; }
  .form-group input, .form-group select { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text1); font-size: 13px; font-family: inherit; }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
  .form-group input::placeholder { color: var(--text3); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-hint { font-size: 10px; color: var(--text3); margin-top: 3px; }
  .ac-list { position: absolute; top: 100%; right: 0; left: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; z-index: 10; max-height: 150px; overflow-y: auto; margin-top: 2px; }
  .ac-item { padding: 7px 12px; font-size: 12px; cursor: pointer; color: var(--text2); }
  .ac-item:hover { background: var(--surface2); color: var(--text1); }
  .ac-wrap { position: relative; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-start; margin-top: 18px; }
  .btn-primary { padding: 8px 20px; border-radius: 8px; background: var(--accent); color: #fff; border: none; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-secondary { padding: 8px 20px; border-radius: 8px; background: var(--surface2); color: var(--text2); border: 1px solid var(--border); font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn-secondary:hover { border-color: var(--accent); color: var(--text1); }

  @media (max-width: 700px) {
    .main-layout { flex-direction: column; align-items: center; }
    .spec-col { min-width: unset; width: 100%; }
    .topbar { flex-direction: column; align-items: stretch; }
    .topbar-sep { display: none; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ══════════════════════════════════════════════════════════

/* ══════════════════════════════════════════════════════════
   STORAGE
   ══════════════════════════════════════════════════════════ */
const LS_KEY = "wf_draft_devices";
function loadDrafts() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { return []; } }
function saveDrafts(d) { localStorage.setItem(LS_KEY, JSON.stringify(d)); }

/* ══════════════════════════════════════════════════════════
   AUTO-COMPLETE INPUT
   ══════════════════════════════════════════════════════════ */
function AutoCompleteInput({ value, onChange, suggestions, placeholder, label, hint }) {
  const [open, setOpen] = useState(false);
  const [filter, setFilter] = useState("");
  const ref = useRef(null);
  const filtered = suggestions.filter(s => {
    const term = (filter || value || "").toLowerCase();
    return typeof s === "string" ? s.toLowerCase().includes(term) : s.name.toLowerCase().includes(term);
  });
  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);
  return (
    <div className="form-group">
      {label && <label>{label}</label>}
      <div className="ac-wrap" ref={ref}>
        <input value={value} placeholder={placeholder} onChange={e => { onChange(e.target.value); setFilter(e.target.value); setOpen(true); }} onFocus={() => setOpen(true)} />
        {open && filtered.length > 0 && (
          <div className="ac-list">
            {filtered.slice(0, 8).map((s, i) => {
              const name = typeof s === "string" ? s : s.name;
              return <div key={i} className="ac-item" onMouseDown={() => { onChange(name, s); setOpen(false); }}>{name}</div>;
            })}
          </div>
        )}
      </div>
      {hint && <div className="form-hint">{hint}</div>}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   ADD DEVICE MODAL
   ══════════════════════════════════════════════════════════ */
function AddDeviceModal({onClose, onSave, isHe}) {
  const [form, setForm] = useState({
    name:"", manufacturer:"", chipset:"", platform:"", os:"",
    screenWidth:240, screenHeight:320, screenSize:'2.4"', screenDensity:"QVGA",
    colorDepth:"16-bit", inputType:"T9 + D-Pad + 3 Softkeys", midlet:"MIDP 2.0 / CLDC 1.1"
  });
  const set = (k,v,extra) => {
    const upd = {...form, [k]:v};
    if (extra) Object.assign(upd, extra);
    setForm(upd);
  };
  const onChipsetSelect = (val, obj) => {
    const upd = { chipset: typeof obj==="string"?obj:obj.name };
    if (obj && typeof obj==="object") { upd.platform=obj.platform; upd.os=obj.os; }
    setForm(f=>({...f,...upd}));
  };
  const onScreenSizeSelect = (val) => {
    const preset = AC_DB.screenPresets.find(p=>p.size===val);
    if (preset) setForm(f=>({...f, screenSize:val, screenWidth:preset.w, screenHeight:preset.h, screenDensity:preset.density}));
    else setForm(f=>({...f, screenSize:val}));
  };
  const handleSave = () => {
    if (!form.name.trim()) return;
    const device = {
      id: form.name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/-+$/,""),
      ...form,
      screenWidth: Number(form.screenWidth),
      screenHeight: Number(form.screenHeight),
      screens: DEFAULT_SCREENS.map(s=>({...s})),
      _draft: true,
    };
    onSave(device);
  };
  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        <div className="modal-head"><h2>{isHe?"הוספת מכשיר חדש":"Add New Device"}</h2><button className="modal-close" onClick={onClose}>×</button></div>
        <div className="modal-body">
          <div className="form-group"><label>{isHe?"שם המכשיר":"Device Name"} *</label><input value={form.name} onChange={e=>set("name",e.target.value)} placeholder={isHe?"למשל: FuturePad X200":"e.g. FuturePad X200"}/></div>
          <AutoCompleteInput label={isHe?"יצרן":"Manufacturer"} value={form.manufacturer} onChange={v=>set("manufacturer",v)} suggestions={AC_DB.manufacturers} placeholder={isHe?"הקלד לחיפוש...":"Type to search..."}/>
          <AutoCompleteInput label={isHe?"מעבד (שבב)":"Chipset"} value={form.chipset} onChange={onChipsetSelect} suggestions={AC_DB.chipsets} placeholder={isHe?"הקלד לחיפוש — ימלא פלטפורמה אוטומטית":"Type to search — auto-fills platform"} hint={isHe?"בחירת מעבד ממלאת פלטפורמה ומערכת הפעלה אוטומטית":"Selecting a chipset auto-fills platform and OS"}/>
          <div className="form-row">
            <AutoCompleteInput label={isHe?"פלטפורמה":"Platform"} value={form.platform} onChange={v=>set("platform",v)} suggestions={AC_DB.platforms} placeholder="Mocor"/>
            <AutoCompleteInput label={isHe?"מערכת הפעלה":"OS"} value={form.os} onChange={v=>set("os",v)} suggestions={AC_DB.osOptions} placeholder="ThreadX RTOS"/>
          </div>
          <hr className="divider" style={{margin:"12px 0"}}/>
          <div className="form-row">
            <div className="form-group"><label>{isHe?"גודל מסך":"Screen Size"}</label>
              <select value={form.screenSize} onChange={e=>onScreenSizeSelect(e.target.value)}>
                {AC_DB.screenPresets.map(p=><option key={p.size} value={p.size}>{p.size} ({p.w}×{p.h} {p.density})</option>)}
              </select>
              <div className="form-hint">{isHe?"בחירת גודל ממלאת רזולוציה אוטומטית":"Selecting size auto-fills resolution"}</div>
            </div>
            <div className="form-group"><label>{isHe?"רזולוציה":"Resolution"}</label>
              <div className="form-row" style={{gap:8}}>
                <input type="number" value={form.screenWidth} onChange={e=>set("screenWidth",e.target.value)} style={{textAlign:"center"}}/>
                <span style={{alignSelf:"center",color:"var(--text3)"}}>×</span>
                <input type="number" value={form.screenHeight} onChange={e=>set("screenHeight",e.target.value)} style={{textAlign:"center"}}/>
              </div>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group"><label>{isHe?"עומק צבע":"Color Depth"}</label><select value={form.colorDepth} onChange={e=>set("colorDepth",e.target.value)}>{AC_DB.colorDepths.map(c=><option key={c}>{c}</option>)}</select></div>
            <div className="form-group"><label>{isHe?"סוג קלט":"Input Type"}</label><select value={form.inputType} onChange={e=>set("inputType",e.target.value)}>{AC_DB.inputTypes.map(t=><option key={t}>{t}</option>)}</select></div>
          </div>
          <div className="form-group"><label>{isHe?"תמיכת MIDlet":"MIDlet Support"}</label><select value={form.midlet} onChange={e=>set("midlet",e.target.value)}>{AC_DB.midletOptions.map(m=><option key={m}>{m}</option>)}</select></div>
          <div className="modal-actions">
            <button className="btn-primary" onClick={handleSave}>{isHe?"הוסף מכשיר":"Add Device"}</button>
            <button className="btn-secondary" onClick={onClose}>{isHe?"ביטול":"Cancel"}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   MAIN APP
   ══════════════════════════════════════════════════════════ */
function App() {
  const [lang, setLang] = useState("he");
  const [devices, setDevices] = useState([]);
  const [drafts, setDrafts] = useState([]);
  const [activeDeviceId, setActiveDeviceId] = useState(null);
  const [activeScreen, setActiveScreen] = useState("idle");
  const [showDeviceMenu, setShowDeviceMenu] = useState(false);
  const [showAddModal, setShowAddModal] = useState(false);
  const menuRef = useRef(null);
  const isHe = lang === "he";

  useEffect(() => {
    fetch("devices.json").then(r=>r.json()).then(d=>{
      setDevices(d);
      if (d.length > 0) setActiveDeviceId(d[0].id);
    }).catch(()=>{});
    setDrafts(loadDrafts());
  }, []);

  useEffect(() => {
    const handler = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setShowDeviceMenu(false); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  const allDevices = [...devices, ...drafts];
  const activeDevice = allDevices.find(d=>d.id===activeDeviceId) || allDevices[0];
  const isDraft = activeDevice?._draft;
  const screens = activeDevice?.screens || DEFAULT_SCREENS;
  const scrDef = screens.find(s=>s.id===activeScreen) || screens[0];
  const sk = isHe ? (scrDef.skHe||scrDef.skEn) : (scrDef.skEn||scrDef.skHe);

  const addDraftDevice = (device) => {
    const updated = [...drafts, device];
    setDrafts(updated);
    saveDrafts(updated);
    setActiveDeviceId(device.id);
    setActiveScreen("idle");
    setShowAddModal(false);
  };

  const deleteDraft = (id) => {
    const updated = drafts.filter(d=>d.id!==id);
    setDrafts(updated);
    saveDrafts(updated);
    if (activeDeviceId===id) { setActiveDeviceId(devices[0]?.id||updated[0]?.id||null); }
  };

  const exportDevice = () => {
    if (!activeDevice) return;
    const clean = {...activeDevice}; delete clean._draft;
    const json = JSON.stringify(clean, null, 2);
    const blob = new Blob([json], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=`${activeDevice.id}.json`; a.click();
    URL.revokeObjectURL(url);
  };

  if (!activeDevice) return <div className="container"><p style={{color:"var(--text3)",padding:40,textAlign:"center"}}>{isHe?"טוען מכשירים...":"Loading devices..."}</p></div>;

  return (
    <>
      {/* Topbar */}
      <div className="topbar">
        <span className="topbar-title">{isHe?"ערכת אפיון מסכים":"Wireframe Platform"}</span>
        <div className="topbar-sep"/>

        {/* Device Selector */}
        <div className="sel-wrap" ref={menuRef}>
          <button className="sel-btn" onClick={()=>setShowDeviceMenu(!showDeviceMenu)}>
            {activeDevice.name} {isDraft && <span style={{fontSize:9,background:"var(--yellow)",color:"#000",padding:"0 5px",borderRadius:3,fontWeight:700}}>{isHe?"טיוטה":"Draft"}</span>}
            <svg viewBox="0 0 12 12"><path d="M2 4l4 4 4-4"/></svg>
          </button>
          <div className={`sel-menu${showDeviceMenu?" open":""}`}>
            {allDevices.map(d=>(
              <div key={d.id} className={`sel-opt${d.id===activeDeviceId?" active":""}`}
                onClick={()=>{setActiveDeviceId(d.id);setActiveScreen("idle");setShowDeviceMenu(false);}}>
                <span>{d.name}</span>
                <span style={{display:"flex",gap:6,alignItems:"center"}}>
                  {d._draft && <span className="draft-badge">{isHe?"טיוטה":"Draft"}</span>}
                  {d._draft && <span style={{color:"var(--red)",cursor:"pointer",fontSize:14,fontWeight:"bold"}} onClick={e=>{e.stopPropagation();deleteDraft(d.id);}}>×</span>}
                </span>
              </div>
            ))}
            <div className="sel-opt" onClick={()=>{setShowDeviceMenu(false);setShowAddModal(true);}}>
              <span className="add-btn">+ {isHe?"הוסף מכשיר חדש":"Add New Device"}</span>
            </div>
          </div>
        </div>

        <div className="topbar-sep"/>
        <span className="badge" style={{direction:"ltr"}}>{activeDevice.screenWidth}×{activeDevice.screenHeight} {activeDevice.screenDensity}</span>

        <div style={{flex:1}}/>

        {/* Lang toggle */}
        <button className={`ctrl-btn${lang==="he"?" active":""}`} onClick={()=>setLang("he")}>עברית</button>
        <button className={`ctrl-btn${lang==="en"?" active":""}`} onClick={()=>setLang("en")}>English</button>

        {isDraft && <button className="ctrl-btn" onClick={exportDevice} style={{color:"var(--accent)",borderColor:"var(--accent)"}} title={isHe?"ייצוא JSON":"Export JSON"}>⬇ {isHe?"ייצוא":"Export"}</button>}
      </div>

      {/* Stats */}
      <div className="stats">
        <div className="stat-box"><div className="stat-val">{activeDevice.screenSize}</div><div className="stat-lbl">{isHe?"גודל מסך":"Screen Size"}</div></div>
        <div className="stat-box"><div className="stat-val">{activeDevice.screenDensity}</div><div className="stat-lbl">{isHe?"רזולוציה":"Resolution"}</div></div>
        <div className="stat-box"><div className="stat-val">{activeDevice.chipset?.split(" ").pop()||"—"}</div><div className="stat-lbl">{isHe?"שבב":"Chipset"}</div></div>
        <div className="stat-box"><div className="stat-val">{activeDevice.platform||"—"}</div><div className="stat-lbl">{isHe?"פלטפורמה":"Platform"}</div></div>
      </div>

      <hr className="divider"/>

      {/* Screen Navigator */}
      <h2>{isHe?"בחירת מסך":"Screen Navigator"}</h2>
      <div className="tabs">
        {screens.map(s=>(
          <button key={s.id} className={`tab${activeScreen===s.id?" active":""}`} onClick={()=>setActiveScreen(s.id)}>
            {isHe?s.he:s.en}
          </button>
        ))}
      </div>

      <div className="main-layout">
        <div className="phone-col">
          <PhoneFrame screenId={activeScreen} softkeys={sk} lang={lang} deviceName={activeDevice.name}/>
          <span className="phone-label">{scrDef.he} — {scrDef.en}</span>
        </div>

        <div className="spec-col">
          <div className="card">
            <div className="card-head">{isHe?"מפרט מסך":"Screen Spec"} <span className="badge-sm">{scrDef.id}</span></div>
            <div className="card-body">
              <div className="spec-row">
                <div className="spec-item"><label>{isHe?"שם המסך":"Screen"}</label><span>{isHe?scrDef.he:scrDef.en}</span></div>
                <div className="spec-item"><label>{isHe?"באנגלית":"In Hebrew"}</label><span>{isHe?scrDef.en:scrDef.he}</span></div>
              </div>
              <hr className="divider" style={{margin:"8px 0"}}/>
              <h3>{isHe?"מקשי פונקציה":"Softkeys"}</h3>
              <div className="softkey-grid">
                <div className="sk-box"><label>LSK</label><span>{sk[0]||"—"}</span></div>
                <div className="sk-box"><label>CSK</label><span>{sk[1]||"—"}</span></div>
                <div className="sk-box"><label>RSK</label><span>{sk[2]||"—"}</span></div>
              </div>
            </div>
          </div>

          <div className="card">
            <div className="card-head">{isHe?"אזורי מסך":"Layout Zones"}</div>
            <div className="card-body">
              <div className="zone-item"><div className="zone-swatch" style={{background:"#16213e"}}></div><span>{isHe?"שורת סטטוס":"Status Bar"} — <span className="px">20px</span></span></div>
              <div className="zone-item"><div className="zone-swatch" style={{background:"#1e2d4a"}}></div><span>{isHe?"כותרת":"Title"} — <span className="px">18px</span></span></div>
              <div className="zone-item"><div className="zone-swatch" style={{background:"#1a1a2e"}}></div><span>{isHe?"תוכן":"Content"} — <span className="px">~{activeDevice.screenHeight-60}px</span></span></div>
              <div className="zone-item"><div className="zone-swatch" style={{background:"#16213e"}}></div><span>{isHe?"מקשי פונקציה":"Softkeys"} — <span className="px">22px</span></span></div>
            </div>
          </div>

          <div className="card">
            <div className="card-head">{isHe?"הערות":"Notes"}</div>
            <div className="card-body">
              <div className="note-item">{isHe?`מידות: ${activeDevice.screenWidth}×${activeDevice.screenHeight} פיקסלים`:`Dimensions: ${activeDevice.screenWidth}×${activeDevice.screenHeight} pixels`}</div>
              <div className="note-item">{isHe?`עומק צבע: ${activeDevice.colorDepth}`:`Color depth: ${activeDevice.colorDepth}`}</div>
              <div className="note-item">{isHe?"פריט מסומן = מיקום סמן D-Pad":"Highlighted = D-Pad cursor"}</div>
              <div className="note-item">{isHe?"נדרשת תמיכת RTL בעברית":"RTL support required for Hebrew"}</div>
            </div>
          </div>
        </div>
      </div>

      <hr className="divider"/>

      {/* Navigation */}
      <h2>{isHe?"מפת ניווט":"Navigation Map"}</h2>
      <div className="card"><div className="card-body" style={{padding:0}}>
        <table className="data-table"><thead><tr><th>{isHe?"ממסך":"From"}</th><th>{isHe?"למסך":"To"}</th><th>{isHe?"פעולה":"Action"}</th></tr></thead>
          <tbody>{FLOWS.map((f,i)=>(<tr key={i}><td>{isHe?f.from:f.from}</td><td>{isHe?f.to:f.to}</td><td className="ltr-cell">{isHe?f.action:f.actionEn}</td></tr>))}</tbody>
        </table>
      </div></div>

      <hr className="divider"/>

      {/* Overview */}
      <h2>{isHe?"תצוגת כל המסכים":"All Screens"}</h2>
      <div className="overview-grid">
        {screens.map(s=>{
          const Screen = SCREEN_COMPONENTS[s.id];
          if (!Screen) return null;
          return (
            <div key={s.id} className={`thumb-card${activeScreen===s.id?" active":""}`} onClick={()=>setActiveScreen(s.id)}>
              <div className="thumb-screen"><div><Screen lang={lang} deviceName={activeDevice.name}/></div></div>
              <div className="thumb-label"><div className="primary">{isHe?s.he:s.en}</div><div className="secondary">{isHe?s.en:s.he}</div></div>
            </div>
          );
        })}
      </div>

      <hr className="divider"/>

      {/* Device Spec */}
      <h2>{isHe?"מפרט מכשיר":"Device Spec"}</h2>
      <div className="card"><div className="card-body" style={{padding:0}}>
        <table className="data-table">
          <tbody>
            <tr><td>{isHe?"שם":"Name"}</td><td>{activeDevice.name}</td></tr>
            <tr><td>{isHe?"יצרן":"Manufacturer"}</td><td>{activeDevice.manufacturer||"—"}</td></tr>
            <tr><td>{isHe?"שבב":"Chipset"}</td><td>{activeDevice.chipset||"—"}</td></tr>
            <tr><td>{isHe?"פלטפורמה":"Platform"}</td><td>{activeDevice.platform||"—"}</td></tr>
            <tr><td>{isHe?"מ.הפעלה":"OS"}</td><td>{activeDevice.os||"—"}</td></tr>
            <tr><td>{isHe?"מסך":"Screen"}</td><td style={{direction:"ltr",textAlign:"left"}}>{activeDevice.screenWidth}×{activeDevice.screenHeight} ({activeDevice.screenDensity}) — {activeDevice.screenSize}</td></tr>
            <tr><td>{isHe?"צבע":"Color"}</td><td>{activeDevice.colorDepth||"—"}</td></tr>
            <tr><td>{isHe?"קלט":"Input"}</td><td>{activeDevice.inputType||"—"}</td></tr>
            <tr><td>MIDlet</td><td>{activeDevice.midlet||"—"}</td></tr>
          </tbody>
        </table>
      </div></div>

      <hr className="divider"/>

      {/* Changelog */}
      <h2>{isHe?"היסטוריית שינויים":"Change History"}</h2>
      <div className="card"><div className="card-body">
        {CHANGELOG.slice().reverse().map((e,i)=>(
          <div key={i} className="cl-entry">
            <span className="cl-date">{e.date}</span>
            <span className="cl-author">{e.author}</span>
            <span className="cl-desc">
              <span className={`cl-tag ${e.tag}`}>{e.tag==="added"?(isHe?"חדש":"ADD"):e.tag==="changed"?(isHe?"שונה":"CHG"):e.tag==="fixed"?(isHe?"תוקן":"FIX"):(isHe?"מידע":"INFO")}</span>
              {e.desc}
            </span>
          </div>
        ))}
      </div></div>

      <div className="info-box">
        <h3>{isHe?"שיתוף ועבודה משותפת":"Sharing"}</h3>
        <p>{isHe
          ?"שתפו את הקישור עם כל מי שצריך. מכשירים חדשים שנוספים נשמרים כטיוטה בדפדפן. לשמירה קבועה, ייצאו את ה-JSON והוסיפו אותו ל-devices.json ב-Git."
          :"Share this URL with anyone. New devices are saved as drafts in your browser. For permanent storage, export the JSON and add it to devices.json via Git."
        }</p>
      </div>

      {showAddModal && <AddDeviceModal onClose={()=>setShowAddModal(false)} onSave={addDraftDevice} isHe={isHe}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
